<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Call Sheet</title>
<style data-reelix-skin data-source="tools/visual-explainer/reelix-doc-skin.css">
/* ── REELIX DOC SKIN — VOLT olive, for PAGES (plans · recaps · audits · reviews) ──
   Source of truth for the tokens: tools/studio/studio-theme.css + tools/studio/SKIN.md
   (the skin Danney locked 2026-07-21). This file mirrors those tokens exactly and
   adds document-scale typography on top, because a plan is read at 15px and a room
   is used at 14px.

   DO NOT hand-edit a page's <style data-reelix-skin> block. Edit THIS file, then:
       python3 tools/visual-explainer/apply_skin.py <page.html>

   THE ACCENT CONTRACT (inherited, non-negotiable):
     --volt  #D4FF3D  identity  → eyebrows, section rules, links, key stats, primary CTA
     --good  #7fc8a0  semantic  → ready / synced / success ONLY
     --amber #e8b06a  semantic  → attention / warning ONLY
   If a heading or a primary action is any colour other than volt, it is wrong.
   ──────────────────────────────────────────────────────────────────────────────── */

:root{
  /* surfaces — verbatim from studio-theme.css */
  --bg:#0c0d0a; --bg2:#101208;
  --panel:#14160f; --panel2:#1b1e15;
  --card:#14160f; --card2:#1b1e15;
  --line:#2a2e20; --line2:#3a4030;
  --ink:#e9ebda; --dim:#8b9079; --mut:#8b9079; --faint:#5c6150;

  /* brand / semantic */
  --volt:#D4FF3D; --amber:#e8b06a; --good:#7fc8a0;
  --heavy:#e0b24f; --check:#e07f86; --brass:#c9973f;
  --pink:#e85cc0; --lav:#b8a6f0;

  /* room accents */
  --refkit:#e8b06a; --worldkit:#9fe06a; --cutkit:#d89fe0;
  --canvaskit:#86c8ea; --dnakit:#e85cc0;

  /* typography */
  --rs-font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --rs-mono:ui-monospace,"SF Mono","Menlo","Monaco","Consolas",monospace;

  /* geometry */
  --rs-radius-sm:6px; --rs-radius:10px; --rs-radius-lg:14px; --rs-radius-xl:18px;
  --rs-shadow:0 4px 18px rgba(0,0,0,.45); --rs-shadow-lg:0 8px 34px rgba(0,0,0,.55);
  --rs-transition:.15s ease;

  /* primary CTA gradient */
  --cta-a:#3a4d10; --cta-b:#26330a; --cta-line:#4f6b16; --cta-ink:#eaffc0;

  /* spacing */
  --rs-space-xs:4px; --rs-space-sm:8px; --rs-space-md:12px;
  --rs-space-lg:16px; --rs-space-xl:22px; --rs-space-2xl:30px;

  /* doc-only */
  --doc-maxw:1080px;
}

*{box-sizing:border-box;min-width:0}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 560px at 50% -12%, var(--bg2) 0%, var(--bg) 60%) fixed;
  color:var(--ink);
  font-family:var(--rs-font);
  font-size:15px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.doc-wrap{max-width:var(--doc-maxw);margin:0 auto;padding:0 26px 110px}

/* ── links ───────────────────────────────────────────────────────────────── */
a{color:var(--volt);text-decoration:none;border-bottom:1px solid rgba(212,255,61,.28)}
a:hover{border-bottom-color:var(--volt)}

/* ── masthead ────────────────────────────────────────────────────────────── */
.doc-mast{padding:46px 0 20px;border-bottom:1px solid var(--line)}
.doc-kicker{
  font-family:var(--rs-mono);font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--volt);font-weight:700;margin:0 0 16px;
}
.doc-mast h1{
  font-size:clamp(32px,5.6vw,54px);font-weight:800;line-height:1.03;
  letter-spacing:-.028em;margin:0;color:var(--ink);
}
.doc-mast h1 em{font-style:normal;color:var(--volt)}
.doc-dek{font-size:16.5px;color:var(--dim);margin:16px 0 0;max-width:70ch;line-height:1.58}
.doc-byline{
  display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:22px;
  font-family:var(--rs-mono);font-size:11px;color:var(--faint);
}
.doc-byline b{color:var(--dim);font-weight:600}

/* ── sections ────────────────────────────────────────────────────────────── */
.doc-sec{margin:58px 0 0;scroll-margin-top:20px}
.doc-eyebrow{
  font-family:var(--rs-mono);font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--volt);font-weight:700;margin:0 0 10px;
}
.doc-sec h2{
  font-size:clamp(22px,3.2vw,30px);font-weight:700;letter-spacing:-.018em;
  line-height:1.14;margin:0;color:var(--ink);
}
.doc-rule{height:2px;width:56px;background:var(--volt);margin:14px 0 24px;border-radius:2px}
h3{font-size:16px;font-weight:700;letter-spacing:-.005em;margin:28px 0 8px;color:var(--ink)}
p{margin:0 0 14px;max-width:74ch;color:var(--ink)}
p.lead,.rs-lead{color:var(--dim);max-width:70ch}
ul,ol{margin:0 0 14px;padding-left:20px;max-width:74ch}
li{margin:0 0 7px}
strong{font-weight:700;color:var(--ink)}
em{color:var(--dim);font-style:italic}
.muted,.rs-muted{color:var(--dim)}
.faint,.rs-faint{color:var(--faint)}
.mono,.rs-mono{font-family:var(--rs-mono);font-size:12.5px}

/* ── callout / verdict panel ─────────────────────────────────────────────── */
.doc-callout{
  background:var(--panel2);border:1px solid var(--line);
  border-left:3px solid var(--volt);border-radius:var(--rs-radius);
  padding:20px 22px;margin:0 0 24px;
}
.doc-callout.attn{border-left-color:var(--amber)}
.doc-callout.ok{border-left-color:var(--good)}
.doc-callout.bad{border-left-color:var(--check)}
.doc-callout > :last-child{margin-bottom:0}

/* ── quote ───────────────────────────────────────────────────────────────── */
blockquote,.doc-quote{
  margin:20px 0;padding:2px 0 2px 20px;border-left:2px solid var(--volt);
  font-size:17px;line-height:1.5;color:var(--ink);max-width:66ch;
}
blockquote cite,.doc-quote cite{
  display:block;font-family:var(--rs-mono);font-style:normal;font-size:10.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-top:10px;
}

/* ── figure / ascii diagram ──────────────────────────────────────────────── */
pre.doc-fig,pre.rs-code-block{
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--rs-radius);
  padding:20px;overflow-x:auto;font-family:var(--rs-mono);font-size:12.5px;
  line-height:1.55;color:var(--ink);margin:0 0 10px;
}
.doc-figcap{font-size:13px;color:var(--faint);font-style:italic;margin:0 0 16px}
code,.rs-code{
  font-family:var(--rs-mono);background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;font-size:12px;color:var(--brass);
}

/* ── tables ──────────────────────────────────────────────────────────────── */
.doc-tscroll{
  overflow-x:auto;border:1px solid var(--line);border-radius:var(--rs-radius-lg);
  background:var(--card);
}
table,.rs-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
th,.rs-table th{
  text-align:left;background:var(--panel2);color:var(--dim);
  font-family:var(--rs-mono);font-size:11px;letter-spacing:.10em;text-transform:uppercase;
  font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;
}
td,.rs-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--card2)}

/* ── chips / tags / pills ────────────────────────────────────────────────── */
.rs-tag,.doc-tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  border-radius:999px;padding:3px 9px;white-space:nowrap;
  border:1px solid currentColor;line-height:1.4;
}
.doc-tag.volt{color:var(--volt)}
.doc-tag.ok{color:var(--good)}
.doc-tag.attn{color:var(--amber)}
.doc-tag.bad{color:var(--check)}
.doc-tag.dim{color:var(--faint)}
.rs-status-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.rs-status-dot.rs-on{background:var(--good)}
.rs-status-dot.rs-attn{background:var(--amber)}
.rs-status-dot.rs-bad{background:var(--check)}

/* ── cards ───────────────────────────────────────────────────────────────── */
.doc-cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:6px}
.rs-card,.doc-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--rs-radius-lg);
  padding:var(--rs-space-xl);position:relative;
  transition:border-color var(--rs-transition),box-shadow var(--rs-transition);
}
.rs-card:hover,.doc-card:hover{border-color:var(--line2)}
.doc-card.is-primary{border-color:rgba(212,255,61,.42);box-shadow:0 0 0 1px rgba(212,255,61,.10)}
.doc-card .doc-card-flag{
  position:absolute;top:-9px;right:16px;background:var(--volt);color:#0c0d0a;
  font-family:var(--rs-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;padding:3px 9px;border-radius:999px;
}
.doc-card .doc-card-idx{
  font-family:var(--rs-mono);font-size:11px;letter-spacing:.16em;color:var(--volt);
  font-weight:700;display:block;margin-bottom:6px;
}
.doc-card h3{margin:0 0 3px;font-size:18px;letter-spacing:-.01em}
.doc-card .doc-card-sub{color:var(--dim);font-size:14px;margin:0 0 14px;font-style:italic}
.doc-card p{font-size:14px;margin:0 0 11px}
.doc-card .doc-card-meta{
  border-top:1px solid var(--line);margin-top:14px;padding-top:12px;
  font-size:13px;color:var(--dim);
}
.doc-card .doc-card-meta div{margin:0 0 6px}
.doc-card .doc-card-meta b{
  font-family:var(--rs-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);display:inline-block;min-width:76px;font-weight:600;
}

/* ── numbered build list ─────────────────────────────────────────────────── */
ol.doc-steps{counter-reset:s;list-style:none;padding:0;margin:0;max-width:74ch}
ol.doc-steps li{counter-increment:s;position:relative;padding:0 0 16px 44px;margin:0}
ol.doc-steps li::before{
  content:counter(s);position:absolute;left:0;top:0;
  font-family:var(--rs-mono);font-size:12px;font-weight:700;color:var(--volt);
  width:26px;height:26px;line-height:24px;text-align:center;
  border:1px solid var(--line2);border-radius:999px;background:var(--panel2);
}

/* ── primary CTA (the canonical olive gradient) ──────────────────────────── */
.btn-primary,.rs-btn-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,var(--cta-a),var(--cta-b));
  border:1px solid var(--cta-line);color:var(--cta-ink);font-weight:700;
  letter-spacing:.03em;border-radius:var(--rs-radius);padding:10px 20px;
  font:inherit;cursor:pointer;text-decoration:none;
  transition:filter var(--rs-transition);
}
.btn-primary:hover,.rs-btn-primary:hover{filter:brightness(1.12)}

/* ── open questions ──────────────────────────────────────────────────────── */
.doc-open{
  background:var(--panel);border:1px dashed var(--line2);
  border-radius:var(--rs-radius-lg);padding:20px 24px;
}
.doc-open > :last-child{margin-bottom:0}

/* ── footer ──────────────────────────────────────────────────────────────── */
.doc-foot{
  margin-top:72px;border-top:1px solid var(--line);padding-top:16px;
  font-family:var(--rs-mono);font-size:11px;color:var(--faint);line-height:1.7;
}

@media (max-width:640px){
  body{font-size:14.5px}
  .doc-wrap{padding:0 18px 80px}
  .doc-card{padding:var(--rs-space-lg)}
}
@media print{
  body{background:#fff;color:#111}
  .doc-card,.doc-callout,.doc-tscroll,pre.doc-fig{border-color:#ccc;background:#fff}
  a{color:#111}
}
</style>
<style>
/* The Call Sheet — page styles. Tokens come from the Reelix doc skin above. */
:root{color-scheme:dark}
.cs{
  --crew-producer:#d9c49a; --crew-director:#7cc0ee; --crew-colorist:#e393e0; --crew-casting:#9bd98a;
  --crew-set:#f29fbe; --crew-camera:#62d2d6; --crew-gaffer:#d6dbe6; --crew-effects:#ad9bf5;
  --crew-editor:#f0a58c; --crew-script:#8ea6f7; --crew-sound:#c99af0;
  --lane-voice:var(--ink); --lane-sfx:#62d2d6; --lane-music:#c99af0; --lane-sub:#d9c49a;
  --top-h:62px; --ed-size:14px; --tl-lab:96px;
  overflow-x:clip; min-height:100vh;
}
[data-crew="producer"]{--c:var(--crew-producer)} [data-crew="director"]{--c:var(--crew-director)}
[data-crew="colorist"]{--c:var(--crew-colorist)} [data-crew="casting"]{--c:var(--crew-casting)}
[data-crew="set"]{--c:var(--crew-set)} [data-crew="camera"]{--c:var(--crew-camera)}
[data-crew="gaffer"]{--c:var(--crew-gaffer)} [data-crew="effects"]{--c:var(--crew-effects)}
[data-crew="editor"]{--c:var(--crew-editor)} [data-crew="script"]{--c:var(--crew-script)}
[data-crew="sound"]{--c:var(--crew-sound)}
.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}
button{font-family:inherit}

/* top bar */
.cs-top{position:sticky;top:0;z-index:40;display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;
  padding:10px 22px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cs-brand{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0;flex-wrap:wrap}
.cs-brand h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1;display:flex;align-items:center;gap:9px;white-space:nowrap;color:var(--ink)}
.cs-brand h1 em{font-style:normal;color:var(--volt)}
.cs-brand h1 .ic{width:21px;height:21px;color:var(--volt)}
.cs-actions{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.cs-count{font-family:var(--rs-mono);font-size:11.5px;color:var(--dim);white-space:nowrap;min-width:86px;text-align:right}
.cs-count b{color:var(--ink);font-weight:700}
.ghost-btn{appearance:none;display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);
  color:var(--dim);font:600 12.5px/1 var(--rs-font);padding:9px 12px;border-radius:var(--rs-radius);cursor:pointer;white-space:nowrap}
.ghost-btn:hover:not(:disabled){border-color:var(--line2);color:var(--ink)}
.ghost-btn:disabled{opacity:.4;cursor:default}
.ghost-btn .flip{transform:scaleX(-1)}
.cs .btn-primary{font:700 13px/1 var(--rs-font);padding:9px 15px;white-space:nowrap}
.cs .btn-primary .ic{width:15px;height:15px}

/* segmented + chips + switch + stepper */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.seg button{appearance:none;border:1px solid transparent;background:transparent;color:var(--dim);font:600 12px/1 var(--rs-font);
  padding:7px 11px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.seg button:hover:not(:disabled){color:var(--ink)}
.seg button.on{background:color-mix(in srgb,var(--volt) 14%,transparent);color:var(--volt);border-color:color-mix(in srgb,var(--volt) 45%,transparent)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg.ro button{cursor:default}
.seg-level{border-radius:999px}
.seg-level button{font-size:13px;padding:8px 14px;border-radius:999px}
/* tiles: ONE object for every visual picker (aspect · resolution · film · grain · genre · time of day · moves) */
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{appearance:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;margin:0;padding:5px 5px 7px;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--dim);font:600 11.5px/1.15 var(--rs-font);
  cursor:pointer;text-align:center;transition:border-color .15s,color .15s,box-shadow .15s}
.tile:hover{border-color:var(--line2);color:var(--ink)}
.tile.on,.tile.on:hover{border-color:var(--volt);color:var(--volt);box-shadow:0 0 0 1px color-mix(in srgb,var(--volt) 30%,transparent)}
.tile:focus-visible{outline:2px solid color-mix(in srgb,var(--volt) 55%,transparent);outline-offset:2px}
.tile-l{display:flex;align-items:center;justify-content:center;gap:4px;max-width:100%;white-space:nowrap}
.tile-l .ic{width:10px;height:10px}
.pick{max-width:720px}
.pick .tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--panel2)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:.82;transition:opacity .15s}
.tile:hover .thumb img,.tile.on .thumb img{opacity:1}
.thumb.px1 img{object-fit:none}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--faint);border:1px dashed var(--line2);border-radius:inherit;font:600 12px/1.2 var(--rs-font)}
.ph .ic{width:16px;height:16px}
.pv{position:relative;width:100%;aspect-ratio:16/9;margin:0 0 8px;border-radius:var(--rs-radius);overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.pv .pv-base{opacity:.3;filter:saturate(.5)}
.pv.px1 img{inset:auto;left:50%;top:50%;width:max(100%,640px);height:auto;transform:translate(-50%,-50%);image-rendering:auto}
.pv .ph{border:0;border-radius:0;flex-direction:column;color:var(--dim)}
.pv-cap{position:absolute;left:10px;bottom:10px;padding:5px 9px;border-radius:999px;background:rgba(8,9,6,.72);color:var(--ink);font:600 11px/1 var(--rs-font);pointer-events:none}
.pv-cap:empty{display:none}
.ar-fr{display:grid;place-items:center;width:52px;height:44px}
.res-fr{display:grid;place-items:end center;width:44px;height:24px}
.ar-bx,.res-bx{display:block;border:1.5px solid currentColor;border-radius:2px;transition:border-color .15s,background .15s}
.tile[data-v="auto"] .ar-bx{border-style:dashed}
.tile.on .ar-bx,.tile.on .res-bx{border-color:var(--volt);background:color-mix(in srgb,var(--volt) 14%,transparent)}
.sw-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink);flex-wrap:wrap}
.sw{appearance:none;position:relative;width:40px;height:22px;border-radius:999px;background:var(--line);border:1px solid var(--line2);cursor:pointer;flex:none;transition:background .2s,border-color .2s;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.sw.on{background:color-mix(in srgb,var(--volt) 28%,transparent);border-color:color-mix(in srgb,var(--volt) 60%,transparent)}
.sw.on::after{transform:translateX(18px);background:var(--volt)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.step button{appearance:none;background:transparent;border:0;color:var(--ink);width:30px;height:28px;cursor:pointer;font:600 16px/1 var(--rs-font)}
.step button:hover{background:var(--panel2)}
.step output{min-width:58px;text-align:center;font:600 13px/1 var(--rs-font);color:var(--ink)}

/* layout */
.cs-main{display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);max-width:1760px;margin:0 auto}
.pp{position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0;z-index:20}
.pp-head{display:flex;align-items:center;gap:6px 12px;padding:14px 22px 10px;flex-wrap:wrap}
.pp-head .doc-eyebrow{margin:0}
.pp-scroll{flex:1;overflow:auto;margin:0 14px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--rs-radius-lg);min-height:0;cursor:text}
.pp-stack{position:relative;min-height:100%}
.ed{font-family:var(--rs-font);font-size:var(--ed-size);font-weight:400;line-height:1.72;letter-spacing:0;padding:18px 20px 44px;margin:0;border:0;
  white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;font-kerning:normal;font-variant-ligatures:normal;text-transform:none}
.pp-hl{color:var(--ink);background:transparent;min-height:100%;pointer-events:none}
.pp-ta{position:absolute;inset:0;width:100%;height:100%;resize:none;outline:none;background:transparent;color:transparent;caret-color:var(--volt);overflow:hidden;display:block}
.pp-ta::selection{background:color-mix(in srgb,var(--volt) 30%,transparent);color:transparent}
.pp-hl .lab{color:var(--c)}
.pp-hl .sec-on{background:color-mix(in srgb,var(--c) 11%,transparent)}
.pp-hl .hot-on{background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent);border-radius:3px}
.pp-hl .tk-voice{color:var(--lane-voice);background:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:3px}
.pp-hl .tk-sfx{color:var(--lane-sfx)}
.pp-hl .tk-music{color:var(--lane-music)}
.pp-hl .tk-sub{color:var(--lane-sub)}
.pp-hl .tk-ref{color:var(--volt)}
.pp-hl .tk-cut{color:var(--crew-editor)}
.pp-hl .tk-time{color:color-mix(in srgb,var(--crew-editor) 70%,var(--ink))}
.pp-hl .tk-deg{color:var(--crew-camera)}
.pp-hl .warn-u{color:var(--amber);text-decoration:underline wavy var(--amber);text-decoration-thickness:1.5px;text-underline-offset:4px}
.pp-hl .flash{animation:flash 1.6s ease-out both}
@keyframes flash{0%{background:color-mix(in srgb,var(--volt) 62%,transparent)}40%{background:color-mix(in srgb,var(--volt) 34%,transparent)}100%{background:color-mix(in srgb,var(--volt) 0%,transparent)}}
.pp-warn{margin:0 14px 12px;display:flex;flex-direction:column;gap:6px;max-height:132px;overflow:auto}
.warn-row{appearance:none;display:flex;gap:8px;align-items:flex-start;text-align:left;width:100%;background:color-mix(in srgb,var(--amber) 8%,var(--panel));
  border:1px solid color-mix(in srgb,var(--amber) 42%,transparent);color:var(--amber);border-radius:10px;padding:8px 12px;font:500 12.5px/1.4 var(--rs-font);cursor:pointer}
.warn-row:hover{border-color:var(--amber)}
.warn-row .ic{margin-top:2px;width:14px;height:14px}
.warn-row b{font-family:var(--rs-mono);font-weight:600;color:var(--ink)}
.warn-row .where{color:var(--dim);font-family:var(--rs-mono);font-size:10.5px;letter-spacing:.06em}

/* crew column */
.crew-col{padding:16px 22px 140px;min-width:0}

.crew{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--rs-radius-lg);margin:0 0 14px;
  scroll-margin-top:calc(var(--top-h) + 14px);transition:border-color .2s,box-shadow .25s}
.crew::before{content:"";position:absolute;left:-1px;top:16px;width:3px;height:30px;border-radius:3px;background:var(--c)}
.crew.lit{border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 38%,transparent),0 12px 32px rgba(0,0,0,.35)}
.crew-h{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:14px 18px 12px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.crew-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.crew-ic .ic{width:17px;height:17px}
.crew h3.crew-name{margin:0;font-size:14.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;color:var(--ink)}
.crew p.crew-job{margin:3px 0 0;font-size:12.5px;color:var(--dim);max-width:none;line-height:1.35}
.crew-b{padding:4px 18px 14px 20px;transition:opacity .25s,filter .25s}
.crew.muted .crew-b{opacity:.38;filter:saturate(.3)}
.card-warns:empty{display:none}
.card-warns{padding:10px 18px 0 20px}
.muted-note{display:none;margin:10px 18px 0 20px;font-size:12px;color:var(--dim);align-items:center;gap:7px}
.crew.muted .muted-note{display:flex}

.ctl{padding:12px 0;border-top:1px solid color-mix(in srgb,var(--line) 75%,transparent);position:relative;border-radius:8px;transition:background .25s}
.crew-b > .ctl:first-child,.ctl-grid > .ctl{border-top:0}
.ctl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 18px;border-top:1px solid color-mix(in srgb,var(--line) 75%,transparent)}
.ctl-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin:0 0 9px;min-height:20px}
.ctl-l{font:600 10.5px/1.2 var(--rs-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.ctl-st{font-size:11.5px;color:var(--faint);font-style:italic}
.ctl-grid .ctl-h{flex-direction:column;align-items:flex-start;gap:7px}
.ctl.lit{background:color-mix(in srgb,var(--c) 8%,transparent);box-shadow:-10px 0 0 color-mix(in srgb,var(--c) 8%,transparent),10px 0 0 color-mix(in srgb,var(--c) 8%,transparent)}
.pulse{animation:pulse 1.1s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--volt) 60%,transparent);background:color-mix(in srgb,var(--volt) 14%,transparent)}
  100%{box-shadow:0 0 0 12px color-mix(in srgb,var(--volt) 0%,transparent);background:transparent}}
.iwarn{display:flex;gap:8px;align-items:flex-start;color:var(--amber);font-size:12.5px;line-height:1.4;margin:8px 0 0;padding:7px 10px;border-radius:8px;
  background:color-mix(in srgb,var(--amber) 8%,transparent);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);cursor:pointer;text-align:left;width:100%;font-family:inherit}
.iwarn .ic{width:14px;height:14px;margin-top:2px}
.iwarn b{font-family:var(--rs-mono);font-weight:600;color:var(--ink)}
.okline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.note{font-size:11.5px;color:var(--faint);display:flex;gap:6px;align-items:center;margin-top:7px;line-height:1.35}
.note .ic{width:13px;height:13px}
.note.attn{color:var(--amber)}

.rng{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;cursor:pointer;--pct:50%}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--volt) 0 var(--pct),var(--line2) var(--pct) 100%)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--volt);border:3px solid var(--bg);box-shadow:0 0 0 1px color-mix(in srgb,var(--volt) 60%,transparent);margin-top:-7px}
.rng::-moz-range-track{height:4px;border-radius:4px;background:var(--line2)}
.rng::-moz-range-progress{height:4px;border-radius:4px;background:var(--volt)}
.rng::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--volt);border:3px solid var(--bg)}
.rng:focus{outline:none}
.rng:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px color-mix(in srgb,var(--volt) 28%,transparent)}
.rng.gone::-webkit-slider-runnable-track{background:repeating-linear-gradient(90deg,var(--line2) 0 6px,transparent 6px 10px)}
.rng-row{display:flex;align-items:center;gap:14px}
.rng-val{font:700 20px/1 var(--rs-mono);color:var(--ink);min-width:66px;text-align:right;white-space:nowrap}
.rng-val small{font-size:12px;color:var(--dim);font-weight:600}
.ticks{position:relative;height:16px;margin:1px 9px 0}
.ticks span{position:absolute;transform:translateX(-50%);font:600 9.5px/1 var(--rs-mono);color:var(--faint);top:5px;white-space:nowrap}
.ticks span::before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:4px;background:var(--line2)}

.fld{display:block;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:400 13px/1.55 var(--rs-font);
  padding:9px 11px;resize:vertical;field-sizing:content;min-height:40px;max-height:230px;transition:border-color .15s}
.fld:focus{outline:none;border-color:color-mix(in srgb,var(--volt) 50%,transparent)}
.fld.gone{border-style:dashed}
.fld::placeholder{color:var(--faint);font-style:italic}
.sel-wrap{position:relative;display:block}
.sel{appearance:none;-webkit-appearance:none;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:500 13px/1.2 var(--rs-font);padding:9px 32px 9px 11px;cursor:pointer}
.sel:focus{outline:none;border-color:color-mix(in srgb,var(--volt) 50%,transparent)}
.sel.gone{border-style:dashed;color:var(--dim)}
.sel-wrap .ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--dim);width:12px;height:12px}

.cost{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cost b{font:800 28px/1 var(--rs-mono);color:var(--volt);letter-spacing:-.02em}
.cost span{font-size:12.5px;color:var(--dim)}

.cast-row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:start;margin:0 0 10px}
.cast-row:last-child{margin-bottom:0}
.cast-name{font:700 11px/1.35 var(--rs-mono);letter-spacing:.07em;color:var(--c);padding-top:10px;cursor:pointer}
.cast-name small{display:block;color:var(--faint);font-weight:600;letter-spacing:.04em;margin-top:2px}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ref{appearance:none;position:relative;display:block;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);cursor:pointer;aspect-ratio:16/9;width:100%;color:var(--ink);font-family:inherit}
.ref:hover{border-color:var(--line2)}
.ref img{width:100%;height:100%;object-fit:cover;display:block}
.ref-cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:6px;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.78));font:600 10px/1.2 var(--rs-mono);color:var(--ink);text-align:left}
.ref-cap .tag{color:var(--volt);white-space:nowrap}
.ref-cap .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--faint);font-size:11px;padding:8px 8px 22px;text-align:center}
.ref-ph .ic{width:20px;height:20px}
.ref.empty{border-style:dashed;background:transparent}
.ref.empty .ref-cap{background:none;color:var(--faint)}

.cam-row{padding:12px 0;border-top:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-radius:8px}
.cam-row:first-child{border-top:0}
.cam-top{display:flex;align-items:center;gap:10px;margin:0 0 6px;flex-wrap:wrap}
.cam-n{font:700 11px/1.2 var(--rs-mono);letter-spacing:.1em;color:var(--ink);cursor:pointer}
.cam-n small{color:var(--dim);font-weight:600;margin-left:6px;letter-spacing:.06em}
.lens-read{margin-left:auto;font:700 14px/1 var(--rs-mono);color:var(--ink);white-space:nowrap}
.lens-read small{color:var(--c);font-weight:600;font-size:11.5px;margin-left:6px}
.cam-ctl{display:grid;grid-template-columns:minmax(0,1fr) 226px;gap:18px;align-items:center}
.cam-ctl > div{display:flex;align-items:center;gap:10px;border-radius:8px}
.cam-sl{flex:1;min-width:0}
.cam-ctl .sel-wrap{flex:1;min-width:0}
.fov{width:46px;height:52px;flex:none;color:var(--c);overflow:visible}
.fov-w{fill:currentColor;fill-opacity:.16;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.fov-cam{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.mvd{width:48px;height:48px;flex:none;color:var(--ink);fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mvd .subj{fill:currentColor;fill-opacity:.22}
.mvd .arr{stroke:var(--c)}
.fov.gone,.mvd.gone{opacity:.35}

.tl-ruler{position:relative;height:18px;margin-left:calc(var(--tl-lab) + 10px)}
.tl-ruler span{position:absolute;bottom:3px;transform:translateX(-50%);font:600 9.5px/1 var(--rs-mono);color:var(--faint);white-space:nowrap}
.tl-ruler span:first-child{transform:none}
.tl-row{display:grid;grid-template-columns:var(--tl-lab) minmax(0,1fr);gap:10px;align-items:center;margin:0 0 6px}
.tl-lab{font:600 10.5px/1.25 var(--rs-mono);color:var(--dim);letter-spacing:.04em}
.tl-lab b{display:block;font-size:12px;color:var(--ink);letter-spacing:.02em}
.tl-track{position:relative;height:44px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tl-grid{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--line) 70%,transparent)}
.clip{appearance:none;position:absolute;top:5px;bottom:5px;border-radius:5px;padding:3px 7px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:center;text-align:left;font-family:inherit;
  background:color-mix(in srgb,var(--crew-editor) 20%,var(--panel2));border:1px solid color-mix(in srgb,var(--crew-editor) 50%,transparent);color:var(--ink);transition:left .35s ease,width .35s ease}
.clip.alt{background:color-mix(in srgb,var(--crew-editor) 9%,var(--panel2))}
.clip b{font:700 10.5px/1.2 var(--rs-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip small{font:600 9.5px/1.2 var(--rs-mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#picTrack{height:58px}
.clip{isolation:isolate}
.clip-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.clip:not(.has-img) .clip-img{visibility:hidden}
.clip.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,11,8,.86),rgba(10,11,8,.5));pointer-events:none}
.clip b,.clip small{position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.clip.has-img small{color:#c9ccba}
.clip.lit,.ev.lit{box-shadow:0 0 0 2px var(--volt)}
.cutmark{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--volt);opacity:.9;transition:left .35s ease}
.tail{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--ink) 7%,transparent) 6px 7px)}
.over{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--amber) 22%,transparent);border-left:1px dashed var(--amber)}
.cuts-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink)}
.cuts-line b{font:700 18px/1 var(--rs-mono);color:var(--volt)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 16px}
.time-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);border-radius:8px;padding:2px 4px}
.time-row .sn{font:700 10.5px/1 var(--rs-mono);color:var(--ink);min-width:44px;letter-spacing:.06em}
.num{width:66px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:600 12.5px/1 var(--rs-mono);padding:6px 6px}
.num:focus{outline:none;border-color:color-mix(in srgb,var(--volt) 50%,transparent)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.lock-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;margin:0 0 8px;border-radius:8px}
.chk{appearance:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);display:grid;place-items:center;cursor:pointer;margin-top:9px;color:transparent;padding:0}
.chk.on{background:var(--volt);border-color:var(--volt);color:var(--bg)}
.chk .ic{width:14px;height:14px}
.lock-row.off .fld{text-decoration:line-through;color:var(--faint);border-style:dashed}

.lanes .tl-track{height:auto;min-height:32px}
.ev{appearance:none;position:absolute;height:22px;border-radius:5px;font:600 10.5px/20px var(--rs-font);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid;text-align:left;transition:left .35s,width .35s}
.ev.voice{color:var(--lane-voice);border-color:color-mix(in srgb,var(--lane-voice) 40%,transparent);background:color-mix(in srgb,var(--lane-voice) 12%,var(--panel2))}
.ev.sfx{color:var(--lane-sfx);border-color:color-mix(in srgb,var(--lane-sfx) 45%,transparent);background:color-mix(in srgb,var(--lane-sfx) 12%,var(--panel2))}
.ev.music{color:var(--lane-music);border-color:color-mix(in srgb,var(--lane-music) 45%,transparent);background:color-mix(in srgb,var(--lane-music) 12%,var(--panel2))}
.ev.sub{color:var(--lane-sub);border-color:color-mix(in srgb,var(--lane-sub) 45%,transparent);background:color-mix(in srgb,var(--lane-sub) 12%,var(--panel2))}
.ev.untimed{border-style:dashed}
.ev:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--volt) 55%,transparent)}
.lane-none{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--faint);font-style:italic}
.marker-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--dim)}
.marker-legend span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.marker-legend code{background:none;border:0;padding:0;font:700 13px/1 var(--rs-mono)}
.mk-music{color:var(--lane-music)} .mk-sfx{color:var(--lane-sfx)} .mk-voice{color:var(--lane-voice)} .mk-sub{color:var(--lane-sub)}
.reftag{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.reftag b{font-family:var(--rs-mono);color:var(--volt);font-weight:700}

[hidden]{display:none!important}
.tl-layer{position:absolute;inset:0}
.tl-ruler span.end{transform:translateX(-100%)}
.iwarn.inline{width:auto;margin:0}
.ics{display:inline-flex}
.step button:disabled{opacity:.35;cursor:default}
.cast-row.lit,.cam-row.lit,.time-row.lit,.lock-row.lit,.cam-ctl > div.lit{background:color-mix(in srgb,var(--c) 9%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 9%,transparent)}
.ref.lit{box-shadow:0 0 0 2px var(--volt)}

@media (max-width:900px){
  .cs{--ed-size:13px;--tl-lab:70px}
  .cs-top{position:static;padding:10px 14px}
  .cs-brand h1{font-size:19px}
  .cs-count{min-width:0;text-align:left}
  .cs-main{grid-template-columns:minmax(0,1fr)}
  .pp{top:0;height:46vh;height:46dvh;border-right:0;border-bottom:1px solid var(--line);background:var(--bg)}
  .pp-head{padding:8px 14px 6px}
  .pp-scroll{margin:0 10px 8px}
  .ed{padding:12px 14px 28px}
  .pp-warn{margin:0 10px 8px;max-height:76px}
  .crew-col{padding:14px 10px 90px}
  .crew{scroll-margin-top:calc(46vh + 12px)}
  .crew-h{padding:12px 14px 10px 16px;gap:10px}
  .crew-b{padding:2px 14px 12px 16px}
  .cast-row{grid-template-columns:minmax(0,1fr);gap:4px}
  .cast-name{padding-top:0}
  .cam-ctl{grid-template-columns:minmax(0,1fr);gap:8px}
}
@media (max-width:560px){
  .pick .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="cs" id="app">
  <header class="cs-top" id="top">
    <div class="cs-brand">
      <h1 id="brandTitle">The <em>Call Sheet</em></h1>
    </div>
    <div class="cs-actions">
      <div class="seg seg-level" id="levelSeg" role="group" aria-label="Prompt level">
        <button type="button" data-level="1">Prompt only</button>
        <button type="button" data-level="2">+ References</button>
      </div>
      <span class="cs-count" id="count" aria-live="polite"></span>
      <button type="button" class="ghost-btn" id="undoBtn" disabled></button>
      <button type="button" class="ghost-btn" id="resetBtn"></button>
      <button type="button" class="btn-primary" id="copyBtn"></button>
    </div>
  </header>
  <main class="cs-main">
    <section class="pp" id="pp" aria-label="Prompt">
      <div class="pp-head">
        <span class="doc-eyebrow">The prompt</span>
      </div>
      <div class="pp-scroll" id="ppScroll">
        <div class="pp-stack">
          <pre class="pp-hl ed" id="hl" aria-hidden="true"></pre>
          <textarea class="pp-ta ed" id="ta" spellcheck="false" autocomplete="off" aria-label="Prompt text"></textarea>
        </div>
      </div>
      <div class="pp-warn" id="ppWarn" hidden></div>
    </section>
    <section class="crew-col" id="crewCol" aria-label="Crew">
      <div id="crewList"></div>
    </section>
  </main>
</div>
<script>
(() => {

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const n2w = (n, like) => {

const hasName = (hay, name) => new RegExp('(^|[^A-Za-z])' + reEsc(name) + '(?![A-Za-z])').test(hay);

function splitSentences(str, base) {

/* ── parse(prompt) → model. The prompt string is the only source of truth. ── */

  if (!name || img.getAttribute('src') !== A(name)) return;
  const ok = e.type === 'load' && img.naturalWidth > 0, was = PIC[name];

}

/* ── caret in the prompt → light the crew card that owns it ── */
function onCaret() {
  if (document.activeElement !== el.ta) return;
  const pos = el.ta.selectionStart, M = S.model;
  let best = null;
  for (const h of M.hot) if (pos >= h.s && pos <= h.e && (!best || h.e - h.s < best.e - best.s)) best = h;
  let crew = null, ctl = null;
  if (best) { crew = best.crew; ctl = best.ctl; }
  else { const sec = secAt(M.secs, pos); if (sec) { crew = sec.crew; ctl = 'sec:' + sec.key; } }
  if (crew === S.activeCrew && ctl === S.activeCtl) return;
  const crewChanged = crew !== S.activeCrew;
  S.activeCrew = crew; S.activeCtl = ctl;
  if (crewChanged) { S.hoverCrew = null; S.hoverCtl = null; }
  renderLit(); renderHL();
  if (crewChanged) { const r = rectOfOffset(pos), box = el.scroll.getBoundingClientRect(); if (r && (r.bottom < box.top || r.top > box.bottom)) revealRange(pos); }
  if (crew) scrollCrewInto(crew, ctl, crewChanged);
}
function scrollCrewInto(crew, ctl, crewChanged) {
  const card = $('#crew-' + crew); if (!card) return;
  const target = ctl ? $$('[data-ctl]').find(n => n.dataset.ctl === ctl && card.contains(n)) : null;
  const mobile = matchMedia('(max-width: 900px)').matches;
  const topOff = mobile ? el.pp.offsetHeight + 10 : el.top.getBoundingClientRect().bottom + 12;   /* on phones the prompt pane is stuck to the top */
  const vh = window.innerHeight, cr = card.getBoundingClientRect();
  let y = null;
  if (crewChanged && (cr.top < topOff || cr.top > topOff + (vh - topOff) * 0.45)) y = cr.top - topOff;
  if (target) {
    const tr = target.getBoundingClientRect(), base = y == null ? 0 : y;
    const needMin = tr.bottom - (vh - 24), needMax = tr.top - topOff - 8;   /* smallest scroll that shows it, largest that keeps its top */
    if (base < needMin || base > needMax) y = Math.min(needMax, Math.max(needMin, base));
  }
  if (y != null && Math.abs(y) > 4) {
    S.quietHover = performance.now() + 900;   /* cards sliding under a still mouse are not a hover */
    window.scrollTo({top: window.scrollY + y, behavior: 'smooth'});
  }
}

/* ── hovering a crew card → highlight its words (and bring them into view after a short dwell) ── */
function setHover(crew, ctl) {

  S.hoverCrew = crew; S.hoverCtl = ctl; renderHL();

function revealFor(crew, ctl) {

  if (ctl && ctl.startsWith('sec:')) { const sec = M.by[ctl.slice(4)]; if (sec) { s = sec.start; e = Math.min(sec.end, sec.start + 220); } }
  else if (ctl) { const h = M.hot.find(x => x.ctl === ctl); if (h) { s = h.s; e = h.e; } }

  if (s != null) revealRange(s, e);
}

/* ── Level 1 ↔ Level 2: insert or lift the REFERENCES block after SCENE ── */
function setLevel(lv) {
  const M = S.model, t = S.text, rf = M.by['REFERENCES'];
  if (lv === 2 && !rf) {
    const anchor = M.by['SCENE'] || M.by['GLOBAL STYLE'];
    if (anchor) { const pos = anchor.end; return commit({text: t.slice(0, pos) + '\n\n' + S.refsStash + t.slice(pos), fr: [pos + 2, pos + 2 + S.refsStash.length]}, 'level'); }
    return commit({text: S.refsStash + '\n\n' + t, fr: [0, S.refsStash.length]}, 'level');
  }
  if (lv === 1 && rf) {
    S.refsStash = t.slice(rf.start, rf.end);
    const i = M.secs.indexOf(rf), prev = M.secs[i - 1], next = M.secs[i + 1];
    const a = prev ? prev.end : rf.start, b = prev ? rf.end : (next ? next.start : t.length);
    commit({text: t.slice(0, a) + t.slice(b), fr: null}, 'level');
    revealRange(Math.max(0, a - 1));
  }
}
function chipClick(list, found, key, v, src) {
  const hits = found[v] || [];
  if (hits.length) return selectRange(hits[0].s, hits[0].e);
  const item = list.find(x => x.v === v); if (item) W.chipAdd(key, item.add, src);
}
function pickOne(cur, v, write) { if (cur && cur.v === v) return selectRange(cur.s, cur.e); write(v); }   /* a lit tile finds its words */
function copyLabel() { el.copy.innerHTML = ic('clipboard') + 'Copy prompt'; }

function bindEvents() {
  el.ta.addEventListener('input', () => {
    pushHistory('text');
    S.text = el.ta.value; S.src = 'text'; S.flash = null; S.session = null;
    S.model = parse(S.text); renderHL();
    clearTimeout(S.deb);
    S.deb = setTimeout(() => { S.src = 'text'; renderControls(); renderLit(); onCaret(); }, 150);
  });
  let raf = 0;
  const caretSoon = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(onCaret); };
  document.addEventListener('selectionchange', () => { if (document.activeElement === el.ta) caretSoon(); });
  el.ta.addEventListener('focus', caretSoon);
  el.scroll.addEventListener('mousedown', e => { if (e.target === el.scroll) { e.preventDefault(); el.ta.focus(); } });
  el.warn.addEventListener('click', e => { const b = e.target.closest('[data-selwarn]'); const w = b && S.model.warnings[+b.dataset.selwarn]; if (w) selectRange(w.s, w.e); });

  el.levelSeg.addEventListener('click', e => { const b = e.target.closest('button[data-level]'); if (b) setLevel(+b.dataset.level); });
  el.undo.addEventListener('click', () => {
    const prev = S.hist.pop(); if (prev == null) return;
    S.histSrc = null; S.text = prev; el.ta.value = prev; S.src = 'undo'; S.flash = null; S.session = null;
    sync(); el.undo.disabled = !S.hist.length;
  });
  el.reset.addEventListener('click', () => {
    if (S.text !== PROMPTS.a) pushHistory('reset');
    S.histSrc = null;
    Object.assign(S, {text: PROMPTS.a, refsStash: PROMPTS.refs, res: '480p', aspect: '16:9', sound: true, bitrate: 'standard', ghosts: [], src: 'reset', flash: null, session: null});
    el.ta.value = S.text; sync(); el.scroll.scrollTop = 0;
  });
  el.copy.addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(S.text); ok = true; }
    catch (_) {
      try { const a = el.ta.selectionStart, b = el.ta.selectionEnd; el.ta.focus(); el.ta.select(); ok = document.execCommand('copy'); el.ta.setSelectionRange(a, b); } catch (__) { ok = false; }
    }
    el.copy.innerHTML = ic(ok ? 'check' : 'warning') + (ok ? 'Copied' : 'Select all and copy');
    clearTimeout(el.copy._t); el.copy._t = setTimeout(copyLabel, 1600);
  });

  const L = el.list;
  L.addEventListener('click', e => {
    const t = e.target, M = S.model; let b;
    if ((b = t.closest('#aspectSeg .tile'))) return W.aspect(b.dataset.v);
    if ((b = t.closest('#resSeg .tile'))) { S.res = b.dataset.v; S.src = 'res'; return renderControls(); }
    if ((b = t.closest('#bitSeg button'))) { S.bitrate = b.dataset.v; S.src = 'bitrate'; return renderControls(); }
    if (t.closest('#soundSw')) { S.sound = !S.sound; S.src = 'sound'; return renderControls(); }
    if ((b = t.closest('#genreTiles .tile'))) return pickOne(M.genre, b.dataset.v, W.genre);
    if ((b = t.closest('#stockTiles .tile'))) return pickOne(M.stock, b.dataset.v, W.stock);
    if ((b = t.closest('#grainTiles .tile'))) return pickOne(M.grain, b.dataset.v, W.grain);
    if ((b = t.closest('#colorTiles .tile'))) return pickOne(M.color, b.dataset.v, W.color);
    if (t.closest('#readSw')) return W.readable(!M.readable);
    if (t.closest('#lockSw')) return W.lockOn(!M.lock);
    if ((b = t.closest('#lockStep button'))) { if (M.lock && M.lock.n >= 0) W.lockN(M.lock.n + +b.dataset.d); return; }
    if ((b = t.closest('#todTiles .tile'))) return chipClick(TOD, M.tod, 'LIGHTING', b.dataset.v, 'tod');
    if ((b = t.closest('#fxTiles .tile'))) return chipClick(FX, M.fx, 'PHYSICS', b.dataset.v, 'fx');
    if (t.closest('#addShot')) return W.addShot();
    if (t.closest('#syncCuts')) return W.syncCuts();
    if (t.closest('#addLock')) return W.addLock();
    if ((b = t.closest('.chk'))) {
      if (b.dataset.lock != null) return W.lockToggle(+b.dataset.lock, false);
      if (b.dataset.ghost != null) return W.lockToggle(null, true, +b.dataset.ghost);
      return;
    }
    if ((b = t.closest('[data-selwarn]'))) { const w = M.warnings[+b.dataset.selwarn]; if (w) selectRange(w.s, w.e); return; }
    if ((b = t.closest('.ev'))) { const k = M.events[+b.dataset.ev]; if (k) selectRange(k.s, k.e); return; }
    if ((b = t.closest('.clip'))) { const x = M.timing.find(q => q.seg === +b.dataset.selclip); if (x) selectRange(x.cs, x.ce); return; }
    if ((b = t.closest('[data-selref]'))) { const r = M.refs.find(q => q.id === b.dataset.selref); if (r) selectRange(r.s, r.ce); return; }
    if ((b = t.closest('[data-selsec]'))) { const sec = M.by[b.dataset.selsec]; if (sec) selectRange(sec.start, sec.labelEnd); return; }
    if ((b = t.closest('[data-selchar]'))) { const c = M.chars.find(q => q.name === b.dataset.selchar); if (c) selectRange(c.s, c.de); return; }
    if ((b = t.closest('[data-selseg]'))) { const o = M.optics.find(q => q.seg === +b.dataset.selseg); if (o) selectRange(o.cs, o.ce); return; }
    if ((b = t.closest('.crew-h'))) {
      const crew = b.closest('.crew').dataset.crew;
      S.activeCrew = crew; S.activeCtl = null; renderLit(); renderHL(); revealFor(crew, null);
    }
  });
  L.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'len') return W.length(+t.value);
    if (t.dataset.lens) return W.lens(+t.dataset.lens, +t.value);
    if (t.dataset.time) { if (t.value === '') return; return W.time(+t.dataset.time, +t.dataset.which, parseFloat(t.value)); }
    if (t.dataset.field) { autosize(t); return fieldInput(t); }
  });
  L.addEventListener('change', e => { const t = e.target; if (t.dataset.move) return W.move(+t.dataset.move, t.value); });
  L.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('textarea.fld')) e.preventDefault(); });
  L.addEventListener('focusout', e => { if (S.session && S.session.el === e.target) S.session = null; });
  L.addEventListener('mouseover', e => {
    const tile = e.target.closest('.pick .tile');
    setPvHover(tile ? tile.closest('.pick').dataset.pick : null, tile ? tile.dataset.v : null);
    if (performance.now() < (S.quietHover || 0)) return;
    const card = e.target.closest('.crew'), c = e.target.closest('[data-ctl]');
    setHover(card ? card.dataset.crew : null, c && !c.classList.contains('crew') ? c.dataset.ctl : null);
  });
  L.addEventListener('mouseleave', () => { setPvHover(null, null); setHover(null, null); });

  const setTopH = () => el.app.style.setProperty('--top-h', el.top.offsetHeight + 'px');
  if (window.ResizeObserver) new ResizeObserver(setTopH).observe(el.top);
  let rz = 0;
  window.addEventListener('resize', () => { setTopH(); clearTimeout(rz); rz = setTimeout(() => { if (S.model) renderControls(); }, 120); });
  setTopH();
}

function init() {
  document.addEventListener('load', onPic, true);   /* img load/error don't bubble: catch them on the way down */
  document.addEventListener('error', onPic, true);
  Object.assign(el, {app: $('#app'), top: $('#top'), ta: $('#ta'), hl: $('#hl'), scroll: $('#ppScroll'), pp: $('#pp'), warn: $('#ppWarn'),
    list: $('#crewList'), levelSeg: $('#levelSeg'), count: $('#count'), undo: $('#undoBtn'), reset: $('#resetBtn'), copy: $('#copyBtn')});
  $('#brandTitle').insertAdjacentHTML('afterbegin', ic('slate'));
  el.undo.innerHTML = ic('reset', 'flip') + 'Undo';
  el.reset.textContent = 'Reset';
  copyLabel();
  buildUI();
  S.refsStash = PROMPTS.refs; S.text = PROMPTS.a; el.ta.value = S.text;
  bindEvents();
  sync();
  window.CS = {get text() { return S.text; }, get model() { return S.model; }, PROMPTS, state: S, ASSETS, PIC};
}
init();
})();
</script>
